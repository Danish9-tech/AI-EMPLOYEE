kind = "web"
previewPath = "/"
title = "AI Employee — Smart Business Assistant"
version = "1.0.0"
id = "artifacts/ai-employee"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24323

[services.development]
run = "pnpm --filter @workspace/ai-employee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-employee", "run", "build" ]
publicDir = "artifacts/ai-employee/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24323"
BASE_PATH = "/"
