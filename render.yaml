# Render Blueprint - AI Employee Backend

services:
  - type: web
    name: ai-employee-api
    env: node
    region: oregon
    plan: free
    rootDir: artifacts/api-server
    buildCommand: npm install --ignore-scripts && npm run build
    startCommand: node ./dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: whatsapp_verify_token_123
        sync: false
