# Render Blueprint
# Backend API Server

services:
  - type: web
    name: api-server
    env: node
    region: oregon
    plan: free
    rootDir: artifacts/api-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: whatsapp_verify_token_123
        sync: false