[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/ai-employee run build"

[deploy]
startCommand = "npx serve -s artifacts/ai-employee/dist -l $PORT"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[deploy.environmentVariables]]
name = "NODE_ENV"
value = "production"
